<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Codeforces Tool · 设置</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Segoe UI", "Helvetica Neue", Helvetica, Arial, "Microsoft YaHei", sans-serif;
      background: #f2f5f9;
      color: #222;
    }
    .wrap { max-width: 560px; margin: 40px auto; padding: 0 16px; }
    h1 { font-size: 22px; margin: 0 0 6px; }
    .sub { color: #5b6b7c; margin: 0 0 24px; line-height: 1.6; }
    .card {
      background: #fff;
      border: 1px solid #e0e6ec;
      border-radius: 8px;
      padding: 16px;
      margin-bottom: 14px;
    }
    label { display: block; font-weight: 600; margin-bottom: 8px; font-size: 14px; }
    input[type="text"], input[type="password"], select {
      width: 100%;
      padding: 9px 12px;
      font-size: 14px;
      border: 1px solid #ccd6e0;
      border-radius: 6px;
      font-family: inherit;
    }
    input:focus, select:focus { outline: none; border-color: #1a7fcb; }
    .hint { margin-top: 8px; font-size: 12.5px; color: #7a8794; line-height: 1.5; }
    .actions { display: flex; align-items: center; gap: 12px; margin-top: 6px; }
    button {
      padding: 9px 22px;
      font-size: 14px;
      font-weight: 600;
      color: #fff;
      background: #1a7fcb;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }
    button:hover { background: #0a6bb0; }
    #status { color: #2e9e5b; font-weight: 600; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Codeforces Tool</h1>
    <p class="sub">在 <a href="https://platform.deepseek.com" target="_blank">platform.deepseek.com</a> 获取 API Key 后填入下方，即可在 Codeforces 题目页翻译题面、在博客页翻译全文。</p>

    <div class="card">
      <label for="apiKey">DeepSeek API Key</label>
      <input type="password" id="apiKey" placeholder="sk-..." autocomplete="off">
      <div class="hint">密钥仅保存在本机浏览器的扩展存储中，只会发送给 DeepSeek 官方接口。</div>
    </div>

    <div class="card">
      <label for="model">模型</label>
      <select id="model">
        <option value="deepseek-chat">deepseek-chat（V3，推荐，快且便宜）</option>
        <option value="deepseek-reasoner">deepseek-reasoner（R1，推理模型，较慢）</option>
      </select>
    </div>

    <div class="card">
      <label for="baseUrl">API 地址</label>
      <input type="text" id="baseUrl" value="https://api.deepseek.com">
      <div class="hint">一般无需修改；若使用代理或兼容接口可改（需保证 manifest 已授权对应域名）。</div>
    </div>

    <div class="card">
      <label for="targetLang">目标语言</label>
      <select id="targetLang">
        <option value="简体中文">简体中文</option>
        <option value="繁体中文">繁体中文</option>
        <option value="英文">英文</option>
      </select>
    </div>

    <div class="actions">
      <button id="save" type="button">保存</button>
      <span id="status"></span>
    </div>
  </div>

  <script src="options.js"></script>
</body>
</html>
